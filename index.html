<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dalefon - Inicio</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out',
            'slide-up': 'slideUp 0.3s ease-out forwards',
            'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            shake: {
              '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
              '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
              '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
              '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
            }
          }
        }
      }
    }
  </script>

  <style>
    .wood-frame {
        box-shadow: 0 0 0 2px rgba(92, 46, 14, 0.8), 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    .dark .wood-frame {
        box-shadow: 0 0 0 2px rgba(40, 20, 5, 0.8), 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }
  </style>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#FDFDFF] dark:bg-slate-900 transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const IconSvg = ({ children, className = "w-5 h-5", size, strokeWidth = "2", ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} width={size || "24"} height={size || "24"} {...props}>
        {children}
      </svg>
    );

    // Íconos
    const Phone = (props) => <IconSvg {...props}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></IconSvg>;
    const MessageCircle = (props) => <IconSvg {...props}><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></IconSvg>;
    const LayoutDashboard = (props) => <IconSvg {...props}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></IconSvg>;
    const Users = (props) => <IconSvg {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconSvg>;
    const Clock = (props) => <IconSvg {...props}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconSvg>;
    const Trophy = (props) => <IconSvg {...props}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></IconSvg>;
    const Lock = (props) => <IconSvg {...props}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></IconSvg>;
    const LogOut = (props) => <IconSvg {...props}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></IconSvg>;
    const Info = (props) => <IconSvg {...props}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></IconSvg>;
    const Moon = (props) => <IconSvg {...props}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></IconSvg>;
    const Sun = (props) => <IconSvg {...props}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></IconSvg>;
    const Newspaper = (props) => <IconSvg {...props}><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></IconSvg>;
    const RefreshCw = (props) => <IconSvg {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></IconSvg>;
    const X = (props) => <IconSvg {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconSvg>;

    // URL del API de Noticias
    const URL_NOTICIAS = 'https://script.google.com/macros/s/AKfycbz5XDdFCDC0LyhlvjXHPJ2RSalS6HETvB6gTFWuTXsFGj43---lPEPUS_4h8I9yaCGUIA/exec';

    // Función auxiliar para convertir enlaces de Google Drive
    const obtenerUrlDirecta = (url) => {
        if (!url) return '';
        const driveRegex = /drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/;
        const match = url.match(driveRegex);
        if (match && match[1]) {
            return `https://drive.google.com/uc?export=view&id=${match[1]}`;
        }
        return url; 
    };

    function App() {
      const [isDarkMode, setIsDarkMode] = useState(false);
      
      // Estados de Seguridad
      const [isAuthenticated, setIsAuthenticated] = useState(() => localStorage.getItem('dalefon_auth') === 'true');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loginError, setLoginError] = useState(false);

      const [toastMessage, setToastMessage] = useState(null);

      // ==========================================
      // ESTADOS DE NOTICIAS
      // ==========================================
      const [noticias, setNoticias] = useState([]);
      const [noticiaActual, setNoticiaActual] = useState(0);
      const [isNewsLoading, setIsNewsLoading] = useState(false);
      const [isTransitioning, setIsTransitioning] = useState(false);
      const [isModalOpen, setIsModalOpen] = useState(false);

      // ==========================================
      // ESTADOS DEL RELOJ CHECADOR
      // ==========================================
      const [shiftState, setShiftState] = useState(() => localStorage.getItem('dalefon_shift_state') || 'idle'); // idle, active, paused
      const [shiftSeconds, setShiftSeconds] = useState(() => parseInt(localStorage.getItem('dalefon_shift_seconds')) || 0);
      const [showTrackerAuth, setShowTrackerAuth] = useState(false);
      const [trackerPassword, setTrackerPassword] = useState('');
      const [trackerError, setTrackerError] = useState(false);
      const [showTrackerAction, setShowTrackerAction] = useState(false);

      const URL_RELOJ = 'https://script.google.com/macros/s/AKfycbwju-FuGS73pfWqe4gvShmnZPbCwYeaC-KtjEHL2WA-TJXdobD-3Iiwj0Dxsj6E430/exec';

      const handleLogin = (e) => {
        e.preventDefault();
        if ((email === 'ventas16@dalefon.mx' && password === 'Jessica?1127') || 
            (email === 'admin' && password === 'admind')) {
          setIsAuthenticated(true);
          localStorage.setItem('dalefon_auth', 'true');
          setLoginError(false);
        } else {
          setLoginError(true);
          setTimeout(() => setLoginError(false), 500);
        }
      };

      const handleLogout = (e) => {
        e.preventDefault();
        localStorage.removeItem('dalefon_auth');
        setIsAuthenticated(false);
        window.location.href = "https://dalefonformulario.github.io/Paneldedesviacion1/";
      };

      const registrarMovimiento = (accion, segundosActuales) => {
        if (!URL_RELOJ || URL_RELOJ === 'PEGA_AQUI_LA_URL_DE_TU_APPS_SCRIPT') return;
        
        const user = email || trackerPassword || "Ejecutivo";
        const url = `${URL_RELOJ}?usuario=${encodeURIComponent(user)}&accion=${encodeURIComponent(accion)}&segundos=${segundosActuales}`;
        
        fetch(url, { mode: 'no-cors' }).catch(err => console.log("Error de conexión al reloj:", err));
      };

      // Efecto del contador de tiempo con persistencia
      useEffect(() => {
        let interval;
        if (shiftState === 'active') {
          // Recuperar tiempo perdido si la página se recargó
          const lastTick = localStorage.getItem('dalefon_last_tick');
          if (lastTick) {
            const missedSeconds = Math.floor((Date.now() - parseInt(lastTick)) / 1000);
            if (missedSeconds > 0) {
              setShiftSeconds(s => s + missedSeconds);
            }
          }

          interval = setInterval(() => {
            setShiftSeconds(s => {
              const newSeconds = s + 1;
              localStorage.setItem('dalefon_shift_seconds', newSeconds.toString());
              return newSeconds;
            });
            localStorage.setItem('dalefon_last_tick', Date.now().toString());
          }, 1000);
        } else if (shiftState === 'paused') {
          localStorage.setItem('dalefon_shift_state', 'paused');
        }
        return () => clearInterval(interval);
      }, [shiftState]);

      const formatTime = (totalSeconds) => {
        const h = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
        const m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
        const s = (totalSeconds % 60).toString().padStart(2, '0');
        return `${h}:${m}:${s}`;
      };

      const handleTrackerLogin = (e) => {
        e.preventDefault();
        if (trackerPassword === 'Jessica?1127' || trackerPassword === 'admind') {
          setShiftState('active');
          localStorage.setItem('dalefon_shift_state', 'active');
          localStorage.setItem('dalefon_shift_seconds', '0');
          localStorage.setItem('dalefon_last_tick', Date.now().toString());
          setShowTrackerAuth(false);
          registrarMovimiento('Entrada', 0);
          setTrackerError(false);
        } else {
          setTrackerError(true);
          setTimeout(() => setTrackerError(false), 500);
        }
      };

      // ==========================================
      // LÓGICA DE NOTICIAS
      // ==========================================
      const cargarNoticias = async () => {
        setIsNewsLoading(true);
        try {
            const respuesta = await fetch(URL_NOTICIAS);
            const datos = await respuesta.json();
            if (datos && datos.length > 0) {
                setNoticias(datos);
                setNoticiaActual(0);
            } else {
                setNoticias([]);
            }
        } catch (error) {
            console.error("Error al cargar noticias:", error);
            setNoticias([]);
        } finally {
            setIsNewsLoading(false);
        }
      };

      useEffect(() => {
          if (isAuthenticated) cargarNoticias();
      }, [isAuthenticated]);

      const cambiarNoticia = (index) => {
          setIsTransitioning(true);
          setTimeout(() => {
              setNoticiaActual(index);
              setIsTransitioning(false);
          }, 300);
      };

      // Rotación Automática
      useEffect(() => {
          if (!isAuthenticated || noticias.length <= 1 || isModalOpen) return;
          const interval = setInterval(() => {
              const nextIndex = (noticiaActual + 1) % noticias.length;
              cambiarNoticia(nextIndex);
          }, 7000);
          return () => clearInterval(interval);
      }, [isAuthenticated, noticias, noticiaActual, isModalOpen]);

      // Swipe Logic
      const touchStartX = useRef(null);
      const touchStartTime = useRef(null);

      const handleTouchStart = (e) => {
          touchStartX.current = e.type.includes('mouse') ? e.pageX : e.touches[0].clientX;
          touchStartTime.current = new Date().getTime();
      };

      const handleTouchEnd = (e) => {
          if (touchStartX.current === null) return;
          const touchEndX = e.type.includes('mouse') || e.type === 'mouseleave' 
              ? e.pageX || touchStartX.current 
              : e.changedTouches[0].clientX;
          
          const diff = touchStartX.current - touchEndX;
          const clickDuration = new Date().getTime() - touchStartTime.current;

          if (diff > 50) {
              cambiarNoticia((noticiaActual + 1) % noticias.length);
          } else if (diff < -50) {
              cambiarNoticia((noticiaActual - 1 + noticias.length) % noticias.length);
          } else if (Math.abs(diff) < 10 && clickDuration < 300 && e.type !== 'mouseleave') {
              setIsModalOpen(true);
          }
          touchStartX.current = null;
      };

      const noticiaActiva = noticias[noticiaActual] || null;

      return (
        <div className={`${isDarkMode ? 'dark' : ''}`}>
          <div className="min-h-screen bg-[#FDFDFF] dark:bg-slate-900 font-sans selection:bg-cyan-100 selection:text-[#3C1053] transition-colors duration-300 relative overflow-x-hidden">
            
            {/* MODAL AUTH RELOJ CHECADOR */}
            {showTrackerAuth && (
              <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                <div className={`relative bg-white dark:bg-slate-800 rounded-3xl shadow-2xl p-8 border-t-8 border-emerald-500 w-full max-w-sm ${trackerError ? 'animate-shake' : 'animate-fade-in'}`}>
                    <button onClick={() => setShowTrackerAuth(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><X size={20}/></button>
                    <h3 className="text-xl font-black text-slate-800 dark:text-white mb-2 text-center">Registro de Entrada</h3>
                    <p className="text-slate-500 dark:text-slate-400 text-sm text-center mb-6">Ingresa tu contraseña para iniciar tu turno.</p>
                    <form onSubmit={handleTrackerLogin}>
                        <input type="password" value={trackerPassword} onChange={(e) => setTrackerPassword(e.target.value)} className="w-full bg-slate-100 dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 mb-4 focus:border-emerald-500 outline-none text-slate-800 dark:text-white transition-colors" placeholder="Contraseña" autoFocus />
                        {trackerError && <p className="text-red-500 text-xs font-bold text-center mb-4">Contraseña incorrecta</p>}
                        <button type="submit" className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl transition-colors shadow-md">Iniciar Turno</button>
                    </form>
                </div>
              </div>
            )}

            {/* MODAL ACCIONES RELOJ CHECADOR */}
            {showTrackerAction && (
              <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                <div className="relative bg-white dark:bg-slate-800 rounded-3xl shadow-2xl p-8 border-t-8 border-cyan-500 w-full max-w-sm animate-fade-in text-center">
                    <button onClick={() => setShowTrackerAction(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><X size={20}/></button>
                    <h3 className="text-xl font-black text-slate-800 dark:text-white mb-6">Control de Turno</h3>
                    <div className="space-y-4">
                        {shiftState === 'active' && (
                            <button onClick={() => { 
                                setShiftState('paused'); 
                                localStorage.setItem('dalefon_shift_state', 'paused');
                                setShowTrackerAction(false); 
                                registrarMovimiento('Inicio Comida', shiftSeconds); 
                            }} className="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-xl transition-colors shadow-md flex items-center justify-center gap-2">
                                <Clock size={18} /> Pausar (Ir a comer)
                            </button>
                        )}
                        {shiftState === 'paused' && (
                            <button onClick={() => { 
                                localStorage.setItem('dalefon_last_tick', Date.now().toString());
                                setShiftState('active'); 
                                localStorage.setItem('dalefon_shift_state', 'active');
                                setShowTrackerAction(false); 
                                registrarMovimiento('Regreso Comida', shiftSeconds); 
                            }} className="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-3 rounded-xl transition-colors shadow-md flex items-center justify-center gap-2">
                                <Clock size={18} /> Regresar de comer
                            </button>
                        )}
                        <button onClick={() => { 
                            setShiftState('idle'); 
                            localStorage.removeItem('dalefon_shift_state');
                            localStorage.removeItem('dalefon_shift_seconds');
                            localStorage.removeItem('dalefon_last_tick');
                            setShowTrackerAction(false); 
                            registrarMovimiento('Fin de Turno', shiftSeconds); 
                            setShiftSeconds(0); 
                        }} className="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-xl transition-colors shadow-md flex items-center justify-center gap-2">
                            <LogOut size={18} /> Finalizar Turno
                        </button>
                    </div>
                </div>
              </div>
            )}

            {/* MODAL DE NOTICIA COMPLETA */}
            {isModalOpen && noticiaActiva && (
              <div className="fixed inset-0 z-[150] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm transition-all duration-300 animate-fade-in" onClick={() => setIsModalOpen(false)}>
                <div className="bg-white dark:bg-[#1e293b] w-11/12 max-w-[550px] rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.3)] overflow-hidden relative border border-slate-200 dark:border-slate-700 animate-slide-up" onClick={e => e.stopPropagation()}>
                    <button onClick={() => setIsModalOpen(false)} className="absolute top-3 right-3 bg-black/40 hover:bg-black/70 text-white w-8 h-8 rounded-full flex items-center justify-center transition-colors z-20 shadow-sm backdrop-blur-md">
                        <X size={18} />
                    </button>
                    <div className="w-full h-48 sm:h-64 relative bg-slate-100 dark:bg-slate-800">
                        <img src={obtenerUrlDirecta(noticiaActiva.imagen)} alt="Noticia" className="absolute inset-0 w-full h-full object-cover" />
                    </div>
                    <div className="p-6 sm:p-8 bg-[#fdf5c9] dark:bg-slate-800 border-t-4 border-amber-400 dark:border-amber-600 max-h-[50vh] overflow-y-auto">
                        <h3 className="text-xl sm:text-2xl font-bold text-slate-800 dark:text-amber-100 mb-4 leading-tight">{noticiaActiva.titulo}</h3>
                        <p className="text-slate-600 dark:text-slate-300 text-[14px] sm:text-[15px] leading-relaxed whitespace-pre-wrap">{noticiaActiva.texto}</p>
                    </div>
                </div>
              </div>
            )}

            {/* POP-UP DE SEGURIDAD */}
            {!isAuthenticated && (
              <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                <div className="absolute inset-0 bg-white/30 dark:bg-black/40 backdrop-blur-md"></div>
                <div className={`relative z-10 w-full max-w-md bg-white dark:bg-slate-800 rounded-[2.5rem] shadow-2xl p-10 border-t-[8px] border-[#3C1053] dark:border-fuchsia-600 ${loginError ? 'animate-shake' : 'animate-slide-up'}`}>
                  <div className="flex justify-center mb-6">
                    <div className="bg-fuchsia-100 dark:bg-fuchsia-900/30 p-4 rounded-full text-[#3C1053] dark:text-fuchsia-300">
                      <Lock size={40} />
                    </div>
                  </div>
                  <div className="text-center mb-8">
                    <h2 className="text-3xl font-black text-[#3C1053] dark:text-white tracking-tighter">Acceso Protegido</h2>
                    <p className="text-gray-500 dark:text-gray-400 font-medium mt-2 text-sm">Ingresa tus credenciales para ver el portal.</p>
                  </div>

                  <form onSubmit={handleLogin} className="space-y-5">
                    <div>
                      <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Usuario o Correo</label>
                      <input 
                        type="text" 
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        className="w-full bg-gray-50 dark:bg-slate-900 border-2 border-gray-200 dark:border-slate-700 text-gray-900 dark:text-white rounded-xl px-4 py-3 focus:outline-none focus:border-[#00E5FF] dark:focus:border-[#00E5FF] transition-colors"
                        placeholder="tu@correo.com"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Contraseña</label>
                      <input 
                        type="password" 
                        value={password}
                        onChange={(e) => setPassword(e.target.value)}
                        className="w-full bg-gray-50 dark:bg-slate-900 border-2 border-gray-200 dark:border-slate-700 text-gray-900 dark:text-white rounded-xl px-4 py-3 focus:outline-none focus:border-[#FF00FF] dark:focus:border-[#FF00FF] transition-colors"
                        placeholder="••••••••"
                        required
                      />
                    </div>
                    {loginError && (
                      <p className="text-red-500 text-sm font-bold text-center mt-2">Credenciales incorrectas. Intenta de nuevo.</p>
                    )}
                    <button 
                      type="submit"
                      className="w-full bg-[#3C1053] hover:bg-[#2A0B3A] dark:bg-fuchsia-600 dark:hover:bg-fuchsia-700 text-white font-black text-lg py-4 rounded-xl shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-1 mt-6"
                    >
                      Ingresar al Portal
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* Navbar */}
            <nav className={`bg-[#3C1053] dark:bg-slate-950 py-4 px-8 sticky top-0 z-50 shadow-2xl print:hidden transition-all duration-500 ${!isAuthenticated ? 'blur-sm pointer-events-none opacity-50' : ''}`}>
              <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center px-4 gap-4 md:gap-0">
                <div className="flex items-center">
                  <div className="flex flex-col">
                    <span className="text-white text-4xl font-bold lowercase tracking-tighter leading-none">
                      dalefon<span className="text-[12px] relative -top-3 font-black">®</span>
                    </span>
                    <span className="text-cyan-400 text-[10px] font-bold tracking-[0.25em] uppercase mt-1.5 ml-1">
                      la telefonía morada
                    </span>
                  </div>
                </div>

                {/* RELOJ CHECADOR EN LA BARRA */}
                <div className="flex-1 flex justify-center w-full md:w-auto">
                    {shiftState === 'idle' && (
                        <button onClick={() => setShowTrackerAuth(true)} className="bg-emerald-500/90 hover:bg-emerald-400 text-white font-bold py-2 px-5 rounded-xl shadow-lg border-2 border-emerald-400/50 hover:border-emerald-400 transition-all flex items-center gap-2 text-sm">
                            <Clock size={18} /> Regístrate, es tu momento de entrar
                        </button>
                    )}
                    {shiftState === 'active' && (
                        <button onClick={() => setShowTrackerAction(true)} className="bg-cyan-500/90 hover:bg-cyan-400 text-white font-bold py-2 px-6 rounded-xl shadow-lg border-2 border-cyan-400/50 hover:border-cyan-400 transition-all flex items-center gap-3">
                            <div className="w-2 h-2 rounded-full bg-white animate-pulse"></div> Trabajando - {formatTime(shiftSeconds)}
                        </button>
                    )}
                    {shiftState === 'paused' && (
                        <button onClick={() => setShowTrackerAction(true)} className="bg-amber-500/90 hover:bg-amber-400 text-white font-bold py-2 px-6 rounded-xl shadow-lg border-2 border-amber-400/50 hover:border-amber-400 transition-all flex items-center gap-3">
                            <Clock size={18} /> Pausa (Comida) - {formatTime(shiftSeconds)}
                        </button>
                    )}
                </div>

                <div className="flex items-center space-x-3">
                  <button
                    onClick={() => setIsDarkMode(!isDarkMode)}
                    className="text-white p-2 rounded-full hover:bg-white/20 transition-all focus:outline-none"
                    title={isDarkMode ? "Cambiar a modo claro" : "Cambiar a modo oscuro"}
                    disabled={!isAuthenticated}
                  >
                    {isDarkMode ? <Sun size={24} /> : <Moon size={24} />}
                  </button>
                  {isAuthenticated && (
                    <a
                      href="https://dalefonformulario.github.io/Paneldedesviacion1/"
                      onClick={handleLogout}
                      className="flex items-center bg-red-500/80 hover:bg-red-600 text-white px-4 py-2 rounded-xl text-sm font-bold transition-all border border-red-400 shadow-md"
                      title="Cerrar Sesión"
                    >
                      <LogOut size={18} className="mr-1 md:mr-2" />
                      <span className="hidden md:inline">Salir</span>
                    </a>
                  )}
                </div>
              </div>
            </nav>

            {/* Contenido Principal */}
            <main className={`py-12 animate-fade-in space-y-10 pb-20 transition-all duration-500 ${!isAuthenticated ? 'blur-sm pointer-events-none opacity-50' : ''}`}>
              <div className="text-center space-y-4 pt-10 px-4">
                <h1 className="text-6xl font-black text-[#3C1053] dark:text-fuchsia-100 tracking-tighter transition-colors">
                  RUBRO DE <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#00E5FF] via-[#7B1FA2] to-[#FF00FF]">CALIDAD</span>
                </h1>
                <p className="text-gray-500 dark:text-gray-400 font-medium text-lg transition-colors">Gestiona y consulta las métricas de desempeño de Dalefon.</p>
              </div>

              {/* CUADRÍCULA DE BOTONES PRINCIPALES */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-5xl mx-auto px-6">
                
                {/* 1. DASHBOARD GENERAL */}
                <a
                  href="DHDoardJessica.html"
                  className="group relative bg-white dark:bg-slate-800 border-t-[6px] border-emerald-500 rounded-[2.5rem] p-8 shadow-xl hover:shadow-2xl transition-all transform hover:-translate-y-2 text-left overflow-hidden block"
                >
                  <div className="absolute top-0 right-0 w-32 h-32 bg-emerald-50 dark:bg-emerald-900/30 rounded-full -mr-10 -mt-10 opacity-60 group-hover:scale-110 transition-transform"></div>
                  <div className="relative z-10 flex items-start space-x-6">
                    <div className="p-5 bg-emerald-50 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400 rounded-3xl group-hover:bg-emerald-500 group-hover:text-white transition-colors">
                      <LayoutDashboard size={40} strokeWidth={1.5} />
                    </div>
                    <div className="space-y-2">
                      <h2 className="text-3xl font-bold text-[#3C1053] dark:text-fuchsia-50">Dashboard</h2>
                      <p className="text-gray-500 dark:text-gray-400 font-medium leading-tight">Métricas en <span className="font-bold">Vivo</span> y asistencias.</p>
                    </div>
                  </div>
                </a>

                {/* 2. CRM */}
                <a
                  href="CrmJessica.html"
                  className="group relative bg-white dark:bg-slate-800 border-t-[6px] border-indigo-500 rounded-[2.5rem] p-8 shadow-xl hover:shadow-2xl transition-all transform hover:-translate-y-2 text-left overflow-hidden block"
                >
                  <div className="absolute top-0 right-0 w-32 h-32 bg-indigo-50 dark:bg-indigo-900/30 rounded-full -mr-10 -mt-10 opacity-60 group-hover:scale-110 transition-transform"></div>
                  <div className="relative z-10 flex items-start space-x-6">
                    <div className="p-5 bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400 rounded-3xl group-hover:bg-indigo-500 group-hover:text-white transition-colors">
                      <Users size={40} strokeWidth={1.5} />
                    </div>
                    <div className="space-y-2">
                      <h2 className="text-3xl font-bold text-[#3C1053] dark:text-fuchsia-50">CRM</h2>
                      <p className="text-gray-500 dark:text-gray-400 font-medium leading-tight">Gestión de relaciones y clientes.</p>
                    </div>
                  </div>
                </a>

                {/* 3. ROSA (CHATS) */}
                <a
                  href="RosaJessica.html"
                  className="group relative bg-white dark:bg-slate-800 border-t-[6px] border-[#FF00FF] rounded-[2.5rem] p-8 shadow-xl hover:shadow-2xl transition-all transform hover:-translate-y-2 text-left overflow-hidden block"
                >
                  <div className="absolute top-0 right-0 w-32 h-32 bg-pink-50 dark:bg-pink-900/30 rounded-full -mr-10 -mt-10 opacity-60 group-hover:scale-110 transition-transform"></div>
                  <div className="relative z-10 flex items-start space-x-6">
                    <div className="p-5 bg-pink-50 dark:bg-pink-900/40 text-pink-600 dark:text-pink-400 rounded-3xl group-hover:bg-[#FF00FF] group-hover:text-white transition-colors">
                      <MessageCircle size={40} strokeWidth={1.5} />
                    </div>
                    <div className="space-y-2">
                      <h2 className="text-3xl font-bold text-[#3C1053] dark:text-fuchsia-50">Hola, soy <span className="text-[#C51162] dark:text-pink-400">Rosa</span></h2>
                      <p className="text-gray-500 dark:text-gray-400 font-medium leading-tight">Tu ejecutiva de calidad en <span className="font-bold">Chats</span>.</p>
                    </div>
                  </div>
                </a>

                {/* 4. AZUL (LLAMADAS) */}
                <a
                  href="AzulJessica.html"
                  className="group relative bg-white dark:bg-slate-800 border-t-[6px] border-[#00E5FF] rounded-[2.5rem] p-8 shadow-xl hover:shadow-2xl transition-all transform hover:-translate-y-2 text-left overflow-hidden block"
                >
                  <div className="absolute top-0 right-0 w-32 h-32 bg-cyan-50 dark:bg-cyan-900/30 rounded-full -mr-10 -mt-10 opacity-60 group-hover:scale-110 transition-transform"></div>
                  <div className="relative z-10 flex items-start space-x-6">
                    <div className="p-5 bg-cyan-50 dark:bg-cyan-900/40 text-cyan-600 dark:text-cyan-400 rounded-3xl group-hover:bg-[#00E5FF] group-hover:text-white transition-colors">
                      <Phone size={40} strokeWidth={1.5} />
                    </div>
                    <div className="space-y-2">
                      <h2 className="text-3xl font-bold text-[#3C1053] dark:text-fuchsia-50">Hola, soy <span className="text-[#0097A7] dark:text-cyan-400">Azul</span></h2>
                      <p className="text-gray-500 dark:text-gray-400 font-medium leading-tight">Resultados y matriz de evaluación en <span className="font-bold">Llamadas</span>.</p>
                    </div>
                  </div>
                </a>

                {/* 5. TIEMPOS */}
                <a
                  href="TiemposJessica.html"
                  className="group relative bg-white dark:bg-slate-800 border-t-[6px] border-orange-500 rounded-[2.5rem] p-8 shadow-xl hover:shadow-2xl transition-all transform hover:-translate-y-2 text-left overflow-hidden block"
                >
                  <div className="absolute top-0 right-0 w-32 h-32 bg-orange-50 dark:bg-orange-900/30 rounded-full -mr-10 -mt-10 opacity-60 group-hover:scale-110 transition-transform"></div>
                  <div className="relative z-10 flex items-start space-x-6">
                    <div className="p-5 bg-orange-50 dark:bg-orange-900/40 text-orange-600 dark:text-orange-400 rounded-3xl group-hover:bg-orange-500 group-hover:text-white transition-colors">
                      <Clock size={40} strokeWidth={1.5} />
                    </div>
                    <div className="space-y-2">
                      <h2 className="text-3xl font-bold text-[#3C1053] dark:text-fuchsia-50">Tiempos</h2>
                      <p className="text-gray-500 dark:text-gray-400 font-medium leading-tight">Control y registro de asistencia.</p>
                    </div>
                  </div>
                </a>

                {/* 6. LOGROS */}
                <a
                  href="LogrosJessica.html"
                  className="group relative bg-white dark:bg-slate-800 border-t-[6px] border-amber-400 rounded-[2.5rem] p-8 shadow-xl hover:shadow-2xl transition-all transform hover:-translate-y-2 text-left overflow-hidden block"
                >
                  <div className="absolute top-0 right-0 w-32 h-32 bg-amber-50 dark:bg-amber-900/30 rounded-full -mr-10 -mt-10 opacity-60 group-hover:scale-110 transition-transform"></div>
                  <div className="relative z-10 flex items-start space-x-6">
                    <div className="p-5 bg-amber-50 dark:bg-amber-900/40 text-amber-600 dark:text-amber-400 rounded-3xl group-hover:bg-amber-400 group-hover:text-white transition-colors">
                      <Trophy size={40} strokeWidth={1.5} />
                    </div>
                    <div className="space-y-2">
                      <h2 className="text-3xl font-bold text-[#3C1053] dark:text-fuchsia-50">Logros</h2>
                      <p className="text-gray-500 dark:text-gray-400 font-medium leading-tight">Insignias, bonos y metas alcanzadas.</p>
                    </div>
                  </div>
                </a>

              </div>
              
              {/* BANNER DE NOTICIAS */}
              <div className="max-w-5xl mx-auto px-6 mt-16 pt-8 border-t border-slate-200 dark:border-slate-800 relative z-20">
                <div className="relative mb-6 flex items-center justify-center">
                    <h3 className="text-lg font-black text-[#3C1053] dark:text-fuchsia-300 uppercase tracking-widest flex items-center gap-2 m-0">
                        <Newspaper className="text-amber-500" size={24} /> Noticias y Avisos
                    </h3>
                    
                    <button onClick={cargarNoticias} disabled={isNewsLoading} className="absolute right-0 text-slate-400 hover:text-[#00E5FF] dark:text-slate-500 dark:hover:text-[#00E5FF] p-2 rounded-full hover:bg-cyan-50 dark:hover:bg-slate-800 transition-all focus:outline-none disabled:opacity-50" title="Actualizar noticias">
                        <RefreshCw size={20} className={isNewsLoading ? 'animate-spin text-[#00E5FF]' : ''} />
                    </button>
                </div>
                
                {isNewsLoading ? (
                  <div className="w-full h-[200px] flex items-center justify-center bg-slate-100 dark:bg-slate-800/50 rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700">
                    <div className="flex flex-col items-center text-slate-500 dark:text-slate-400">
                        <RefreshCw size={32} className="animate-spin mb-3 text-amber-500" />
                        <span className="font-bold">Cargando noticias de Dalefon...</span>
                    </div>
                  </div>
                ) : noticias.length === 0 ? (
                  <div className="w-full h-[180px] flex items-center justify-center bg-slate-100 dark:bg-slate-800/50 rounded-2xl border-2 border-slate-200 dark:border-slate-700">
                    <p className="text-slate-500 dark:text-slate-400 font-bold">En este momento no hay comunicados nuevos. ¡Excelente turno!</p>
                  </div>
                ) : (
                  <div className="flex flex-col items-center">
                      <div 
                        className="wood-frame relative w-full h-[220px] md:h-[200px] rounded-2xl overflow-hidden transition-all flex flex-row border-[6px] border-[#8B4513] dark:border-[#5c2e0e] bg-slate-800 cursor-pointer shadow-2xl"
                        onMouseDown={handleTouchStart}
                        onMouseUp={handleTouchEnd}
                        onMouseLeave={handleTouchEnd}
                        onTouchStart={handleTouchStart}
                        onTouchEnd={handleTouchEnd}
                      >
                          <div className="absolute top-1.5 left-1.5 w-3 h-3 bg-slate-300 rounded-full shadow-md border border-slate-400 z-30 pointer-events-none"></div>
                          <div className="absolute top-1.5 right-1.5 w-3 h-3 bg-slate-300 rounded-full shadow-md border border-slate-400 z-30 pointer-events-none"></div>
                          <div className="absolute bottom-1.5 left-1.5 w-3 h-3 bg-slate-300 rounded-full shadow-md border border-slate-400 z-30 pointer-events-none"></div>
                          <div className="absolute bottom-1.5 right-1.5 w-3 h-3 bg-slate-300 rounded-full shadow-md border border-slate-400 z-30 pointer-events-none"></div>

                          <div className="w-[60%] p-6 flex flex-col justify-center relative bg-[#fdf5c9] dark:bg-amber-900/40">
                              <div className="absolute top-0 right-0 w-0 h-0 border-t-[24px] border-l-[24px] border-t-[#8B4513] dark:border-t-[#5c2e0e] border-l-transparent z-10"></div>
                              <div className={`transition-all duration-300 relative z-0 ${isTransitioning ? 'opacity-0 scale-95' : 'opacity-100 scale-100'}`}>
                                  <h4 className="text-[#3C1053] dark:text-amber-100 font-black text-lg md:text-xl mb-2 leading-tight line-clamp-2">{noticiaActiva?.titulo}</h4>
                                  <p className="text-slate-700 dark:text-amber-200/90 text-sm md:text-base font-medium line-clamp-3 leading-snug">{noticiaActiva?.texto}</p>
                              </div>
                          </div>

                          <div className="w-[40%] relative bg-slate-200 dark:bg-slate-700 overflow-hidden">
                              <img src={obtenerUrlDirecta(noticiaActiva?.imagen)} alt="Noticia" draggable="false" className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-300 pointer-events-none ${isTransitioning ? 'opacity-0' : 'opacity-100'}`} />
                          </div>
                      </div>

                      <div className="flex justify-center gap-3 mt-6">
                          {noticias.map((_, index) => (
                              <button 
                                key={index}
                                onClick={() => cambiarNoticia(index)}
                                className={`w-3 h-3 rounded-full transition-all duration-300 hover:scale-125 focus:outline-none ${index === noticiaActual ? 'bg-amber-500 w-8 shadow-md' : 'bg-slate-300 dark:bg-slate-600 hover:bg-amber-400'}`}
                                aria-label={`Ver noticia ${index + 1}`}
                              />
                          ))}
                      </div>
                  </div>
                )}
              </div>

            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
